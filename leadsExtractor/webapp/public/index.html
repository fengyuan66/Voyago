<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leads Extractor UI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Leads Extractor</h1>
      <p>Draw your AOI on the map, tune settings, and run extraction.</p>
    </header>

    <main class="layout">
      <section class="panel map-panel">
        <div class="panel-title-row">
          <h2>AOI Map</h2>
          <button id="fitAoiBtn" type="button">Fit AOI</button>
        </div>
        <div id="map"></div>
        <p class="hint">Use rectangle draw tool to define AOI.</p>
      </section>

      <section class="panel controls-panel">
        <h2>Settings</h2>
        <form id="configForm">
          <div class="grid">
            <label>
              Min Lat
              <input id="minLat" type="number" step="0.000001" required />
            </label>
            <label>
              Max Lat
              <input id="maxLat" type="number" step="0.000001" required />
            </label>
            <label>
              Min Lng
              <input id="minLng" type="number" step="0.000001" required />
            </label>
            <label>
              Max Lng
              <input id="maxLng" type="number" step="0.000001" required />
            </label>
            <label>
              Search Term
              <input id="searchTerm" type="text" />
            </label>
            <label>
              Zoom
              <input id="zoom" type="number" min="1" max="21" />
            </label>
            <label>
              Lat Step
              <input id="latStep" type="number" step="0.0001" />
            </label>
            <label>
              Lng Step
              <input id="lngStep" type="number" step="0.0001" />
            </label>
            <label>
              Max Places/Cell
              <input id="maxPlacesPerCell" type="number" min="1" />
            </label>
            <label>
              Max Photos/Place
              <input id="maxPhotosPerPlace" type="number" min="1" />
            </label>
            <label>
              Max Scroll Rounds
              <input id="maxScrollRounds" type="number" min="1" />
            </label>
            <label>
              Photo Min Width
              <input id="photoMinWidth" type="number" min="50" />
            </label>
            <label>
              SlowMo (ms)
              <input id="slowMoMs" type="number" min="0" />
            </label>
            <label>
              Timeout (ms)
              <input id="timeoutMs" type="number" min="5000" />
            </label>
            <label>
              Output Dir
              <input id="outputDir" type="text" />
            </label>
          </div>

          <div class="toggles">
            <label><input id="headless" type="checkbox" /> Headless browser</label>
            <label><input id="downloadPhotos" type="checkbox" /> Download photos</label>
          </div>

          <div class="actions">
            <button id="runBtn" type="submit">Start Extraction</button>
            <button id="stopBtn" type="button" disabled>Stop</button>
          </div>
        </form>
      </section>

      <section class="panel status-panel">
        <h2>Status</h2>
        <div id="statusBox" class="status-box">Idle</div>
        <h3>Live Logs</h3>
        <pre id="logs"></pre>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
